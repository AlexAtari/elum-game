services:
  - type: web
    name: elum-multiplayer
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: ELUM_SERVER_HOST
        value: 0.0.0.0
      - key: ELUM_ALLOWED_ORIGINS
        value: https://alexatari.github.io
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: elum-multiplayer-state
          property: connectionString

  - type: keyvalue
    name: elum-multiplayer-state
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off
