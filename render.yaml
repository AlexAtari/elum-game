services:
  - type: web
    name: elum-multiplayer
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ELUM_SERVER_HOST
        value: 0.0.0.0
      - key: ELUM_ALLOWED_ORIGINS
        value: https://alexatari.github.io
